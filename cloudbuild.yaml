steps:
  # 1. Build Docker image with Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tingatingasafari:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tingatingasafari:latest'
      - '.'

  # 2. Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tingatingasafari:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tingatingasafari:latest'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tingatingasafari'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tingatingasafari:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=3000'

images:
  - 'gcr.io/$PROJECT_ID/tingatingasafari:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tingatingasafari:latest'

timeout: '900s'
